<div class="auth-provider-list">
{% if default_auth_system %}
  <a class="auth-provider-link button" href="{% url "auth@start" system_name=default_auth_system %}?return_url={{return_url}}">
    <span>Log in with {{default_auth_system|title}}</span>
    <span class="auth-provider-arrow" aria-hidden="true">→</span>
  </a>
{% else %}
  {% for auth_system in enabled_auth_systems %}
    {% if auth_system != "password" %}
      <a class="auth-provider-link" href="{{SECURE_URL_HOST}}{% url "auth@start" system_name=auth_system %}?return_url={{return_url}}">
        <img src="/static/auth/login-icons/{{auth_system}}.png" alt="" aria-hidden="true" />
        <span>Continue with {{auth_system|title}}</span>
        <span class="auth-provider-arrow" aria-hidden="true">→</span>
      </a>
    {% endif %}
  {% endfor %}
{% endif %}
</div>
